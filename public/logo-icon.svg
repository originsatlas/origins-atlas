<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DAA645"/>
      <stop offset="50%" stop-color="#F5DA9A"/>
      <stop offset="100%" stop-color="#C89B3C"/>
    </linearGradient>
    <linearGradient id="dark-gold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B6914"/>
      <stop offset="100%" stop-color="#DAA645"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="#0B2D5B"/>
  <!-- Stylized "A" as roof/triangle -->
  <path d="M256 100 L400 340 L370 340 L256 150 L142 340 L112 340 Z" fill="url(#gold-gradient)"/>
  <!-- Inner house shape -->
  <path d="M256 170 L340 310 L172 310 Z" fill="#0B2D5B"/>
  <!-- Location pin dot -->
  <circle cx="256" cy="260" r="20" fill="url(#gold-gradient)"/>
  <!-- Horizontal bar -->
  <rect x="180" y="340" width="152" height="28" rx="4" fill="url(#gold-gradient)"/>
  <!-- C arc wrapping around the A -->
  <path d="M380 180 C420 220, 430 320, 380 380 C340 430, 260 440, 200 420" 
        stroke="url(#gold-gradient)" stroke-width="22" fill="none" stroke-linecap="round"/>
</svg>
